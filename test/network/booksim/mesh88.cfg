// S8-* 8x8 matrix (docs/NoC_BookSim_Validation.md): BookSim 2 base configuration for the 8x8
// mesh comparison. The routing function, the VC count, the traffic pattern and the injection rate
// are given on the command line by test/network/steps/step8.sh (routing_function=..., num_vcs=...,
// traffic=..., injection_rate=..., sim_type=...).
//
// Mapping onto Octopus (NetworkOnly, grid2d 8x8, endpoint i at router i):
//   num_vcs                   = interconnect.vcs_per_class (one traffic class on both sides)
//   vc_buf_size 4             = interconnect.vc_depth 4
//   packet_size 5             = 16-byte flits, 8-byte header, 64-byte payload (ceil(72/16) = 5)
//   VA + SA + ST, 1 cycle each, routing_delay 0 (lookahead)
//                             = interconnect.router_latency 3 (head arrival to its switch traversal)
//   credit_delay 1, buffer slot held until the flit has left the switch
//                             = interconnect.credit_latency 4 (as in mesh44_dor.cfg)
//   separable_input_first     = interconnect.sa_allocator input_first
//   round_robin + priority age = interconnect.arbiter_type FCFSArbiter (oldest packet first; BookSim
//                               breaks age ties round robin, Octopus has no ties)
// BookSim's terminal channels (injection and ejection) add a constant 3 cycles to its network
// latency, which Octopus does not model; the comparison subtracts them (see the document).
topology = mesh;
k = 8;
n = 2;

routing_function = dor;
num_vcs = 2;
vc_buf_size = 4;
wait_for_tail_credit = 0;

router = iq;
vc_allocator = separable_input_first;
sw_allocator = separable_input_first;
arb_type = round_robin;
priority = age;
alloc_iters = 1;
routing_delay = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;
credit_delay = 1;
input_speedup = 1;
output_speedup = 1;
internal_speedup = 1.0;

traffic = uniform;
packet_size = 5;
injection_rate_uses_flits = 1;
injection_rate = 0.1;

sim_type = latency;
sample_period = 10000;
warmup_periods = 3;
max_samples = 10;
latency_thres = 1000.0;
print_activity = 0;
