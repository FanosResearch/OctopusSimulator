// S8-BOOKSIM (docs/NoC_Test_Plan.md s11): BookSim 2 configuration mirroring S4-SAT-DEF.
// 4x4 mesh, dimension-order routing, one VC per class, 4-flit buffers, 5-flit packets, uniform
// random traffic. The injection rate is given on the command line in flits per cycle per node
// (Octopus: packets per 1000 ticks per endpoint x 5 flits / 1000).
topology = mesh;
k = 4;
n = 2;

routing_function = dor;
num_vcs = 1;
vc_buf_size = 4;
wait_for_tail_credit = 0;

// router: input-queued, separable allocators, three pipeline cycles per hop (VA, SA, ST), one-cycle
// links and credits. Mapping onto Octopus (test/network/steps/step8.sh): router_latency 3
// (= VA + SA + ST from the head's arrival to its switch traversal) and credit_latency 4
// (= SA + ST + credit_delay): a BookSim buffer slot stays occupied until the flit has traversed the
// switch, an Octopus VC slot is released when the flit is forwarded, so the extra residency goes
// into the credit loop. With Octopus's shipped router_latency 2 / credit_latency 1 the same 4-flit
// buffers turn over faster and the mesh carries about 0.48 flits/cycle/node instead of 0.28.
router = iq;
vc_allocator = islip;
sw_allocator = islip;
alloc_iters = 1;
routing_delay = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;
credit_delay = 1;
input_speedup = 1;
output_speedup = 1;
internal_speedup = 1.0;

traffic = uniform;
packet_size = 5;
injection_rate_uses_flits = 1;
injection_rate = 0.1;

sim_type = latency;
sample_period = 5000;
warmup_periods = 3;
max_samples = 10;
latency_thres = 1000.0;
print_activity = 0;
