; Rank[0], BankGroup[1], Bank[2], SubArray[3], Row[4], Col[5]
;AddressMapping=425 ; For the verification purpose
AddressMapping=012345
; Channel, Rank, BankGroup, Bank, SubArray
RequestQueue=0000
WriteQueue=0
