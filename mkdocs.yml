site_name: Octopus Simulator
site_description: A cycle-accurate cache system simulator with configurable interconnects
site_url: https://fanosresearch.github.io/OctopusSimulator/
repo_url: https://github.com/FanosResearch/OctopusSimulator
repo_name: FanosResearch/OctopusSimulator
edit_uri: edit/gh-page/content/
docs_dir: content
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - tables

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

plugins:
  - search

nav:
  - Home: index.md
  - Quick start:
      - Install and verify: quick-start.md
      - Run a benchmark: run-a-benchmark.md
      - Demo and visualizer: demo.md
      - gem5 integration: gem5-integration.md
  - Documentation:
      - Fundamentals:
          - Architecture overview: architecture.md
          - Supported configurations: supported-configurations.md
      - Components and configuration:
          - Configuration: configuration.md
          - Interconnects and memory: components.md
          - Message encoding: tutorial/MessageEncoding.md
          - State and data: tutorial/StateAndData.md
          - Architecture deep dive: tutorial/Architecture.md
      - Monitoring and analysis:
          - Monitoring overview: monitoring.md
          - Logger: tutorial/Logger.md
          - Debugger: tutorial/Debugger.md
          - Trace format: tutorial/Trace.md
          - Visualizer: tutorial/Visualizer.md
          - Tasks: tutorial/Tasks.md
      - Extending Octopus:
          - Add a coherence protocol: add-a-protocol.md
          - Protocol worked example: tutorial/AddingAProtocol.md
          - Interconnect multi-hop plan: tutorial/NoC_MultiHop_Plan.md
          - Logger design plan: tutorial/Logger_DesignB_plan.md
          - Contributing: contributing.md
  - Reference:
      - Reference manual: reference-manual.md
  - Research:
      - Reproducibility: reproducibility.md
      - Publications and citation: publications.md
  - Project:
      - License: license.md
      - Links: links.md

copyright: Copyright belongs to the respective contributors and upstream projects.