<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 750" width="1280" height="750" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif" role="img" aria-label="The Octopus system as shipped: four cores with private L1 caches on a TripleBus, a shared LLC, a point-to-point memory bus and DRAM, with one LLC miss from core 0 routed through it as a numbered path, one number per LatencyReport column, whose colour is the kind of time the column measures">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14212A"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B32A8"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E7C73"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker>
  </defs>
  <style>
    .blk { fill:#FFFFFF; stroke:#5A6B75; stroke-width:1.2 }
    .mem { fill:#EAF1F6; stroke:#2F6F9F; stroke-width:1.2 }
    .io  { fill:#F4F1FB; stroke:#6244C7; stroke-width:1.2 }
    .ctl { fill:#FDF6E6; stroke:#9A6B12; stroke-width:1.2 }
    .cpu { fill:#FDF6E6; stroke:#9A6B12; stroke-width:1.2 }
    .ttl { font-size:12px; fill:#14212A; font-weight:600 }
    .lbl { font-size:10.5px; fill:#14212A; font-weight:600 }
    .sub { font-size:9.5px; fill:#5E6E76 }
    .mono{ font-family:'IBM Plex Mono',monospace }
    .lane{ stroke:#6244C7; stroke-width:1.2; fill:none; opacity:.55 }
    .stub{ stroke:#5A6B75; stroke-width:1.2; fill:none }
    .thin{ stroke:#14212A; stroke-width:1.2; fill:none }
    .rt  { stroke-width:3; fill:none; stroke-linejoin:round }
    .par { stroke-width:2.2; fill:none; stroke-dasharray:5 3 }
    .num { font-size:9.5px; font-weight:700; fill:#FFFFFF; text-anchor:middle }
    .wl  { font-size:8.5px; font-family:'IBM Plex Mono',monospace }
    .off { opacity:.42 }
  </style>
  <rect width="1280" height="750" fill="#FCFBF8"/>
  <text x="34" y="30" font-size="16" font-weight="700" fill="#14212A">The system, end to end — one LLC miss from core 0, and the column that measures each hop</text>
  <text x="34" y="47" class="sub">MultiCoreSystem as shipped: 4 cores, snoop MESI on a TripleBus, one shared LLC, a point-to-point memory bus, DRAM. Colour = the LatencyReport column; ⓪–⑨ are the report's nine latency columns in order, at the Logger stamps that bound them.</text>
  <rect x="34" y="70" width="190" height="130" rx="5" class="blk" stroke="#0E7C73" stroke-width="1.8"/>
  <text x="44" y="86" class="ttl">Core 0 · the requester</text>
  <rect x="44" y="94" width="170" height="28" rx="4" class="cpu"/>
  <text x="52" y="108" class="lbl">CPU</text>
  <text x="80" y="108" class="sub">trace replay or gem5</text>
  <rect x="44" y="144" width="170" height="48" rx="4" class="mem"/>
  <text x="52" y="158" class="lbl">L1</text>
  <text x="52" y="170" class="sub">private · MSHR · write-back buffer</text>
  <text x="52" y="182" class="sub mono">CacheControllerExclusive · MESI</text>
  <rect x="246" y="70" width="190" height="130" rx="5" class="blk"/>
  <text x="256" y="86" class="ttl">Core 1 · snoops</text>
  <rect x="256" y="94" width="170" height="28" rx="4" class="cpu"/>
  <text x="264" y="108" class="lbl">CPU</text>
  <text x="292" y="108" class="sub">trace replay or gem5</text>
  <rect x="256" y="144" width="170" height="48" rx="4" class="mem"/>
  <text x="264" y="158" class="lbl">L1</text>
  <text x="264" y="170" class="sub">private · MSHR · write-back buffer</text>
  <text x="264" y="182" class="sub mono">CacheControllerExclusive · MESI</text>
  <line x1="341" y1="200" x2="341" y2="294" class="stub"/>
  <line x1="306" y1="122" x2="306" y2="144" class="thin"/>
  <line x1="366" y1="144" x2="366" y2="122" class="thin"/>
  <rect x="458" y="70" width="190" height="130" rx="5" class="blk"/>
  <text x="468" y="86" class="ttl">Core 2 · snoops</text>
  <rect x="468" y="94" width="170" height="28" rx="4" class="cpu"/>
  <text x="476" y="108" class="lbl">CPU</text>
  <text x="504" y="108" class="sub">trace replay or gem5</text>
