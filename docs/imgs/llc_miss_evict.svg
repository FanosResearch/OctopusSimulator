<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" width="1280" height="1000"
     font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif" role="img"
     aria-label="A read miss into a full set, highlighted over the Octopus last-level cache datapath: the requested line in one colour, the evicted victim in another: bus interfaces on top, control on the left, one cache array in the middle read by an untimed bits path and a timed data port on the right, MSHR and write-back buffer, and the memory bus below">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14212A"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9A6B12"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#BE3F24"/></marker>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E7C73"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker>
  </defs>
  <style>
    .blk  { fill:#FFFFFF; stroke:#5A6B75; stroke-width:1.2 }
    .mem  { fill:#EAF1F6; stroke:#2F6F9F; stroke-width:1.2 }
    .ctl  { fill:#FDF6E6; stroke:#9A6B12; stroke-width:1.2 }
    .io   { fill:#F4F1FB; stroke:#6244C7; stroke-width:1.2 }
    .ttl  { font-size:12px;   fill:#14212A; font-weight:600 }
    .lbl  { font-size:10.5px; fill:#14212A; font-weight:600 }
    .sub  { font-size:9.5px;  fill:#5E6E76 }
    .mono { font-family:'IBM Plex Mono',monospace }
    .wire { stroke:#14212A; stroke-width:1.8; fill:none }
    .cwire{ stroke:#9A6B12; stroke-width:1.4; fill:none; stroke-dasharray:5 3 }
    .iwire{ stroke:#BE3F24; stroke-width:1.6; fill:none }
    .byp  { stroke:#14212A; stroke-width:1.2; fill:none; stroke-dasharray:2 3 }
    .wl   { font-size:9px; fill:#14212A; font-family:'IBM Plex Mono',monospace }
    .cl   { font-size:9px; fill:#9A6B12; font-family:'IBM Plex Mono',monospace }
    .rl   { font-size:9px; fill:#BE3F24; font-family:'IBM Plex Mono',monospace }
    .hit  { stroke:#0E9F8E; stroke-width:8; fill:none; stroke-opacity:.42; stroke-linejoin:round; stroke-linecap:round }
    .vic  { stroke:#F59E0B; stroke-width:8; fill:none; stroke-opacity:.45; stroke-linejoin:round; stroke-linecap:round }
    .badge{ fill:#0E7C73; stroke:#FFFFFF; stroke-width:1.5 }
    .vbadge{ fill:#B45309; stroke:#FFFFFF; stroke-width:1.5 }
    .bdig { font-size:9.5px; font-weight:700; fill:#FFFFFF; text-anchor:middle }
  </style>

  <rect width="1280" height="1000" fill="#FCFBF8"/>
  <text x="34" y="30" font-size="16" font-weight="700" fill="#14212A">Octopus LLC datapath — the path of a read miss that evicts</text>
  <text x="34" y="47" class="sub">CacheController_End2End + CacheDataHandler_COTS · 32 KB, 2-way, 64 B lines · MESI_LLC coherence FSM · one timed data port</text>
  <text x="34" y="59" font-size="9" font-weight="600"><tspan fill="#0E7C73">Highlighted: a GetS missing in a FULL set — teal the requested line, </tspan><tspan fill="#B45309">amber the victim, chosen by LRU only when the fill lands. Its INV goes out on TX service (inclusion) and it is always written back (no dirty bit). A GetM evicts identically; an owned victim returns its data first.</tspan></text>

  <!-- ═══ bus[0] ═══ -->
  <rect x="34" y="64" width="1212" height="62" rx="4" class="io"/>
  <text x="46" y="80" class="lbl mono" fill="#4B32A8">bus[0] — TripleBus interface</text>
  <rect x="200" y="86" width="150" height="30" rx="3" class="blk"/><text x="211" y="99" class="lbl">RX request</text><text x="211" y="111" class="sub mono">GetS GetM PutM</text>
  <rect x="374" y="86" width="150" height="30" rx="3" class="blk"/><text x="385" y="99" class="lbl">RX response</text><text x="385" y="111" class="sub mono">data in</text>
  <rect x="840" y="86" width="150" height="30" rx="3" class="blk"/><text x="851" y="99" class="lbl">TX response</text><text x="851" y="111" class="sub mono">data out</text>
  <rect x="1064" y="86" width="170" height="30" rx="3" class="blk" stroke="#BE3F24"/><text x="1075" y="99" class="lbl" fill="#BE3F24">TX service</text><text x="1075" y="111" class="sub mono">INV to sharers</text>

  <!-- ═══ centre: queue → admission → decode → array ═══ -->
  <rect x="330" y="152" width="420" height="54" rx="4" class="blk"/>
  <text x="342" y="170" class="ttl">processing queue</text>
  <text x="484" y="170" class="sub mono">FR-FCFS · 64 entries · requests and data</text>
  <g fill="#F2F7FB" stroke="#5A6B75" stroke-width=".9">
    <rect x="342" y="178" width="28" height="18"/><rect x="372" y="178" width="28" height="18"/>
    <rect x="402" y="178" width="28" height="18"/><rect x="432" y="178" width="28" height="18"/>
    <rect x="462" y="178" width="28" height="18"/><rect x="492" y="178" width="28" height="18"/>
  </g>
  <text x="526" y="192" class="sub mono">…</text>
  <path d="M275 116 L275 136 L345 136 L345 150" class="wire" marker-end="url(#d)"/>
  <line x1="449" y1="116" x2="449" y2="150" class="wire" marker-end="url(#d)"/>

  <path d="M400 226 L680 226 L652 262 L428 262 Z" class="ctl"/>
  <text x="470" y="245" class="lbl" fill="#9A6B12">admission select</text>
  <text x="696" y="238" class="sub">first entry the FSM would not stall, and — for a</text>
  <text x="696" y="250" class="sub">demand request — none older to the same line</text>
  <text x="696" y="262" class="sub">queued ahead; incoming data is exempt</text>
  <line x1="540" y1="206" x2="540" y2="224" class="wire" marker-end="url(#d)"/>
  <line x1="540" y1="262" x2="540" y2="280" class="wire" marker-end="url(#d)"/>

  <rect x="330" y="282" width="420" height="32" rx="3" class="blk"/>
  <line x1="560" y1="282" x2="560" y2="314" stroke="#5A6B75"/>
  <line x1="668" y1="282" x2="668" y2="314" stroke="#5A6B75"/>
  <text x="404" y="302" class="lbl mono">tag [63:14]</text>
  <text x="582" y="302" class="lbl mono">set [13:6]</text>
  <text x="682" y="302" class="lbl mono">off</text>
  <text x="340" y="302" class="sub">addr</text>

  <!-- array -->
  <rect x="330" y="346" width="570" height="206" rx="4" class="mem"/>
  <text x="342" y="366" class="ttl">cache array — 256 sets × 2 ways</text>
  <text x="342" y="381" class="sub">one structure: a line holds its coherence bits and its data together</text>
  <g font-size="9" class="mono" fill="#5E6E76"><text x="346" y="399">way 0</text><text x="626" y="399">way 1</text></g>
  <g fill="#FFFFFF" stroke="#8FB2C9" stroke-width=".9">
    <rect x="346" y="405" width="266" height="22"/><rect x="626" y="405" width="258" height="22"/>
    <rect x="346" y="431" width="266" height="22"/><rect x="626" y="431" width="258" height="22"/>
    <rect x="346" y="457" width="266" height="22"/><rect x="626" y="457" width="258" height="22"/>
  </g>
  <g font-size="9" class="mono" fill="#14212A">
    <text x="354" y="420">V state tag owner ║ 64 B data</text><text x="634" y="420">V state tag owner ║ 64 B data</text>
    <text x="354" y="446">V state tag owner ║ 64 B data</text><text x="634" y="446">V state tag owner ║ 64 B data</text>
    <text x="354" y="472">⋮</text><text x="634" y="472">⋮</text>
  </g>
  <text x="342" y="500" class="sub">state = the line's MESI_LLC state · owner = the L1 that holds it</text>
  <text x="342" y="514" class="sub">a way may be reserved for one core (way_partition);</text>
  <text x="342" y="526" class="sub">LRU picks the victim among the ways that are left</text>
  <line x1="594" y1="314" x2="594" y2="344" class="wire" marker-end="url(#d)"/>
  <text x="600" y="334" class="wl">set</text>

  <!-- ═══ left: control ═══ -->
  <rect x="34" y="352" width="264" height="74" rx="4" class="ctl"/>
  <text x="46" y="371" class="ttl" fill="#9A6B12">tag compare · hit / way select</text>
  <g>
    <path d="M46 382 L74 390 L74 404 L46 412 Z" class="blk"/><text x="53" y="401" class="lbl">=</text>
    <path d="M86 382 L114 390 L114 404 L86 412 Z" class="blk"/><text x="93" y="401" class="lbl">=</text>
  </g>
  <text x="126" y="394" class="sub">one comparator per way</text>
  <text x="126" y="408" class="sub">untimed: claims no port</text>

  <rect x="34" y="446" width="264" height="120" rx="4" class="ctl"/>
  <text x="46" y="465" class="ttl" fill="#9A6B12">coherence FSM</text>
  <text x="46" y="480" class="sub mono">Protocols_FSM/MESI_LLC.csv</text>
  <text x="46" y="497" class="sub">state × event → next state + actions</text>
  <text x="46" y="514" class="sub">events GetS GetM Replacement</text>
  <text x="46" y="526" class="sub">PutM_from{Owner,NonOwner}</text>
  <text x="46" y="538" class="sub">Data_from{Lower,Upper} Own_Invalidation</text>
  <text x="46" y="556" class="sub">states N I S EorM · 7 transient</text>

  <rect x="34" y="586" width="264" height="86" rx="4" class="ctl"/>
  <text x="46" y="605" class="ttl" fill="#9A6B12">action sequencer</text>
  <text x="46" y="622" class="sub">GetData · SendData · SendExclusiveData</text>
  <text x="46" y="634" class="sub">SaveData · SetOwner · ClearOwner · IssueInv</text>
  <text x="46" y="646" class="sub">WriteBack · Stall</text>
  <text x="46" y="664" class="sub">a port claim, an allocation, or a message</text>

  <!-- control wires: short horizontals in the left gutter -->
  <path d="M404 314 L404 330 L312 330 L312 380 L300 380" class="wire" marker-end="url(#d)"/>
  <text x="318" y="326" class="wl">tag</text>
  <path d="M328 416 L300 416" class="wire" marker-end="url(#d)"/>
  <text x="304" y="434" class="wl">bits</text>
  <path d="M166 426 L166 444" class="cwire" marker-end="url(#c)"/>
  <text x="172" y="440" class="cl">hit · way · state</text>
  <path d="M298 506 L328 506" class="cwire" marker-end="url(#c)"/>
  <text x="303" y="499" class="cl">next</text>
  <text x="303" y="517" class="cl">state</text>
  <path d="M166 566 L166 584" class="cwire" marker-end="url(#c)"/>
  <text x="172" y="580" class="cl">actions</text>

  <!-- ═══ right: the timed data port ═══ -->
  <path d="M946 346 L1246 346 L1222 386 L970 386 Z" class="ctl"/>
  <text x="1010" y="364" class="lbl" fill="#9A6B12">array-port arbiter</text>
  <text x="1000" y="378" class="sub" fill="#9A6B12">round-robin over the four L1 slots</text>
  <g class="wl">
    <path d="M990 320 L1000 344" class="wire" marker-end="url(#d)"/><text x="946" y="314">demand read</text>
    <path d="M1090 320 L1090 344" class="wire" marker-end="url(#d)"/><text x="1046" y="314">evict read</text>
    <text x="1136" y="314">fill / write-back write</text>
  </g>
  <rect x="946" y="400" width="200" height="40" rx="3" class="blk"/>
  <text x="958" y="416" class="lbl">port busy timer</text>
  <text x="958" y="431" class="sub mono">A_LLC = 10 cycles</text>
  <path d="M1096 386 L1096 398" class="cwire" marker-end="url(#c)"/>
  <path d="M944 420 L902 420" class="wire" marker-end="url(#d)"/>
  <text x="908" y="415" class="wl">data</text>
  <text x="946" y="458" class="sub">the arbiter is consulted only while the port is free</text>

  <!-- bypass -->
  <path d="M1166 400 L1166 478 L928 478 L928 442 L902 442" class="byp" marker-end="url(#d)"/>
  <text x="946" y="494" class="sub">a line still held in the MSHR or the write-back buffer is</text>
  <text x="946" y="506" class="sub">read or written without waiting for the port — it is not</text>
  <text x="946" y="518" class="sub">in the array — but it restarts the timer, so it cuts in</text>

  <!-- ═══ MSHR / write-back buffer ═══ -->
  <rect x="946" y="560" width="300" height="72" rx="4" class="mem"/>
  <text x="958" y="579" class="ttl">MSHR — 64 entries</text>
  <text x="958" y="596" class="sub">a line being fetched lives here, not in the array</text>
  <text x="958" y="612" class="sub mono">allocate on miss · free on fill</text>

  <rect x="946" y="652" width="300" height="72" rx="4" class="mem"/>
  <text x="958" y="671" class="ttl">write-back buffer — 32 entries</text>
  <text x="958" y="688" class="sub">a dirty victim waits here; its way is freed at once</text>
  <text x="958" y="704" class="sub mono">allocate on eviction · free on write</text>

  <!-- array → victim → PWB, in the gutter between centre and right -->
  <path d="M900 470 L920 470 L920 688 L944 688" class="wire" marker-end="url(#d)"/>
  <text x="836" y="466" class="wl">victim</text>

  <!-- sequencer → the structures it drives, along a clear channel -->
  <path d="M166 672 L166 764 L1096 764 L1096 726" class="cwire" marker-end="url(#c)"/>
  <path d="M934 764 L934 596 L944 596" class="cwire" marker-end="url(#c)"/>
  <text x="470" y="760" class="cl">allocate · claim the port · send</text>

  <!-- data out of the array, straight up the gutter to TX response -->
  <path d="M900 400 L920 400 L920 140 L915 140 L915 118" class="wire" marker-end="url(#d)"/>
  <text x="926" y="200" class="wl">line data</text>
  <text x="926" y="212" class="wl">→ TX response</text>

  <!-- IssueInv up the right margin -->
  <path d="M298 642 L1262 642 L1262 101 L1236 101" class="iwire" marker-end="url(#r)"/>
  <text x="310" y="636" class="rl">IssueInv — inclusion: evicting a line an L1 holds invalidates its copy first</text>

  <!-- ═══ bus[1] + memory ═══ -->
  <rect x="34" y="848" width="1212" height="62" rx="4" class="io"/>
  <text x="46" y="864" class="lbl mono" fill="#4B32A8">bus[1] — point-to-point memory bus (full duplex)</text>
  <rect x="430" y="870" width="160" height="30" rx="3" class="blk"/><text x="441" y="883" class="lbl">TX read / write</text><text x="441" y="895" class="sub mono">miss · dirty evict</text>
  <rect x="620" y="870" width="150" height="30" rx="3" class="blk"/><text x="631" y="883" class="lbl">RX fill</text><text x="631" y="895" class="sub mono">data from DRAM</text>
  <rect x="800" y="870" width="430" height="30" rx="3" class="blk"/><text x="811" y="889" class="lbl mono">MCsim DDR4-2400 · FR-FCFS scheduler</text>
  <line x1="770" y1="885" x2="798" y2="885" class="wire" marker-end="url(#d)"/>
  <path d="M1246 596 L1256 596 L1256 800 L510 800 L510 868" class="wire" marker-end="url(#d)"/>
  <path d="M1140 724 L1140 812 L540 812 L540 868" class="wire" marker-end="url(#d)"/>
  <text x="560" y="796" class="wl">miss → memory read</text>
  <text x="590" y="824" class="wl">dirty victim → memory write</text>
  <path d="M680 868 L680 836 L1270 836 L1270 332 L1190 332 L1190 344" class="wire" marker-end="url(#d)"/>
  <text x="1000" y="832" class="wl">fill → port → array write, MSHR freed</text>

  <!-- ═══ legend ═══ -->
  <g>
    <line x1="34" y1="944" x2="66" y2="944" class="wire"/><text x="74" y="948" class="sub">data path (timed)</text>
    <line x1="186" y1="944" x2="218" y2="944" class="byp"/><text x="226" y="948" class="sub">register-resident access, bypasses the port</text>
    <line x1="472" y1="944" x2="504" y2="944" class="cwire"/><text x="512" y="948" class="sub">control (untimed)</text>
    <line x1="638" y1="944" x2="670" y2="944" class="iwire"/><text x="678" y="948" class="sub">back-invalidation (inclusion)</text>
    <rect x="34" y="964" width="13" height="11" class="mem"/><text x="54" y="974" class="sub">storage</text>
    <rect x="124" y="964" width="13" height="11" class="ctl"/><text x="144" y="974" class="sub">control logic</text>
    <rect x="236" y="964" width="13" height="11" class="io"/><text x="256" y="974" class="sub">interconnect interface</text>
    <text x="410" y="974" class="sub">the Logger and the raw trace observe: queue arrival · admission · port claim · data emitted</text>
  </g>
  <!-- ═══ overlay: read miss into a full set: teal = requested line, amber = victim ═══ -->
  <g>
    <path d="M275 116 L275 136 L345 136 L345 200 L435 200 L435 330 L312 330 L312 378 L166 378 L166 768 L934 768 L934 626 L1256 626 L1256 804 L510 804 L510 905 L1180 905 L1180 862 L680 862 L680 840 L1270 840 L1270 332 L1210 332 L1210 393 L1096 393 L1096 420 L905 420 L905 400 L920 400 L920 140 L915 140 L915 118" class="hit" marker-end="url(#h)"/>
    <path d="M900 470 L920 470 L920 688 L944 688" class="vic" marker-end="url(#v)"/>
    <path d="M298 642 L1262 642 L1262 101 L1236 101" class="vic" marker-end="url(#v)"/>
    <path d="M1140 724 L1140 812 L540 812 L540 868" class="vic" marker-end="url(#v)"/>
    <circle cx="256" cy="150" r="8.5" class="badge"/><text x="256" y="153.5" class="bdig">1</text>
    <circle cx="455" cy="246" r="8.5" class="badge"/><text x="455" y="249.5" class="bdig">2</text>
    <circle cx="318" cy="298" r="8.5" class="badge"/><text x="318" y="301.5" class="bdig">3</text>
    <circle cx="286" cy="364" r="8.5" class="badge"/><text x="286" y="367.5" class="bdig">4</text>
    <circle cx="286" cy="462" r="8.5" class="badge"/><text x="286" y="465.5" class="bdig">5</text>
    <circle cx="286" cy="602" r="8.5" class="badge"/><text x="286" y="605.5" class="bdig">6</text>
    <circle cx="1232" cy="572" r="8.5" class="badge"/><text x="1232" y="575.5" class="bdig">7</text>
    <circle cx="1212" cy="885" r="8.5" class="badge"/><text x="1212" y="888.5" class="bdig">8</text>
    <circle cx="752" cy="884" r="8.5" class="badge"/><text x="752" y="887.5" class="bdig">9</text>
    <circle cx="1236" cy="292" r="8.5" class="badge"/><text x="1236" y="295.5" class="bdig">10</text>
    <circle cx="866" cy="392" r="8.5" class="badge"/><text x="866" y="395.5" class="bdig">11</text>
    <circle cx="896" cy="150" r="8.5" class="badge"/><text x="896" y="153.5" class="bdig">12</text>
    <circle cx="932" cy="580" r="8.5" class="vbadge"/><text x="932" y="583.5" class="bdig">A</text>
    <circle cx="1232" cy="664" r="8.5" class="vbadge"/><text x="1232" y="667.5" class="bdig">B</text>
    <circle cx="312" cy="660" r="8.5" class="vbadge"/><text x="312" y="663.5" class="bdig">C</text>
    <circle cx="1150" cy="130" r="8.5" class="vbadge"/><text x="1150" y="133.5" class="bdig">D</text>
    <circle cx="1154" cy="770" r="8.5" class="vbadge"/><text x="1154" y="773.5" class="bdig">E</text>
    <line x1="34" y1="984" x2="66" y2="984" class="hit"/>
    <text x="74" y="987" font-size="8.5" fill="#0E7C73">requested line — 1 arrives · 2 admitted · 3 decoded · 4 tag miss; the set is full · 5 FSM: GetData, SetOwner · 6 sequencer: allocate, send · 7 MSHR · 8 DRAM read · 9 fill on RX · 10 port claim → busy timer · 11 written into the victim's way, MSHR freed · 12 data out on TX response</text>
    <line x1="34" y1="996" x2="66" y2="996" class="vic"/>
    <text x="74" y="999" font-size="8.5" fill="#B45309">victim — A to the write-back buffer as the fill lands (LRU among the requester's ways) · B Replacement raised · C IssueInv → INV on TX service · D sharers drop it; the LLC gets its own INV back · E WriteBack: read via the bypass, written to memory on bus[1]</text>
  </g>
</svg>
