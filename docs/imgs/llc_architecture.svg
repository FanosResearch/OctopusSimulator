<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1010" width="1280" height="1010"
     font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif" role="img"
     aria-label="Datapath of the Octopus last-level cache: bus interfaces, processing queue with its admission gate, coherence FSM, one cache array read two ways (untimed state read and a timed single data port behind a round-robin arbiter), MSHR, write-back buffer, and the memory bus">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14212A"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9A6B12"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#BE3F24"/></marker>
  </defs>
  <style>
    .blk  { fill:#FFFFFF; stroke:#5A6B75; stroke-width:1.3 }
    .mem  { fill:#EAF1F6; stroke:#2F6F9F; stroke-width:1.3 }
    .ctl  { fill:#FDF6E6; stroke:#9A6B12; stroke-width:1.3 }
    .io   { fill:#F0ECFA; stroke:#6244C7; stroke-width:1.3 }
    .lbl  { font-size:11.5px; fill:#14212A; font-weight:600 }
    .sub  { font-size:9.5px;  fill:#5E6E76 }
    .mono { font-family:'IBM Plex Mono',monospace }
    .wire { stroke:#14212A; stroke-width:2; fill:none }
    .cwire{ stroke:#9A6B12; stroke-width:1.4; fill:none; stroke-dasharray:5 3 }
    .iwire{ stroke:#BE3F24; stroke-width:1.8; fill:none }
    .byp  { stroke:#14212A; stroke-width:1.4; fill:none; stroke-dasharray:2 3 }
    .wl   { font-size:9.5px; fill:#14212A; font-family:'IBM Plex Mono',monospace }
    .cl   { font-size:9.5px; fill:#9A6B12; font-family:'IBM Plex Mono',monospace }
  </style>

  <rect width="1280" height="1010" fill="#FBFAF7"/>
  <text x="34" y="30" font-size="17" font-weight="700" fill="#14212A">Octopus LLC datapath</text>
  <text x="34" y="48" class="sub">CacheController_End2End + CacheDataHandler_COTS · 32 KB, 2-way, 64 B lines · MESI_LLC coherence FSM · one timed data port (10 cycles)</text>

  <!-- ══════════ bus[0] interface ══════════ -->
  <rect x="34" y="66" width="1212" height="62" rx="4" class="io"/>
  <text x="46" y="82" class="lbl mono" fill="#4B32A8">bus[0] — TripleBus interface</text>
  <rect x="210" y="88" width="150" height="30" rx="3" class="blk"/><text x="222" y="101" class="lbl">RX request</text><text x="222" y="113" class="sub mono">GetS GetM PutM</text>
  <rect x="384" y="88" width="150" height="30" rx="3" class="blk"/><text x="396" y="101" class="lbl">RX response</text><text x="396" y="113" class="sub mono">data in</text>
  <rect x="558" y="88" width="150" height="30" rx="3" class="blk"/><text x="570" y="101" class="lbl">TX response</text><text x="570" y="113" class="sub mono">data out</text>
  <rect x="1040" y="88" width="180" height="30" rx="3" class="blk" stroke="#BE3F24"/><text x="1052" y="101" class="lbl" fill="#BE3F24">TX service</text><text x="1052" y="113" class="sub mono">INV to sharers</text>

  <!-- ══════════ processing queue ══════════ -->
  <rect x="150" y="162" width="420" height="52" rx="4" class="blk"/>
  <text x="162" y="180" class="lbl">processing queue — FR-FCFS, 64 entries</text>
  <g fill="#F2F7FB" stroke="#5A6B75" stroke-width=".9">
    <rect x="162" y="188" width="30" height="18"/><rect x="194" y="188" width="30" height="18"/>
    <rect x="226" y="188" width="30" height="18"/><rect x="258" y="188" width="30" height="18"/>
    <rect x="290" y="188" width="30" height="18"/><rect x="322" y="188" width="30" height="18"/>
  </g>
  <text x="360" y="202" class="sub mono">…</text>
  <text x="150" y="230" class="sub">requests and incoming data share this queue</text>
  <line x1="285" y1="118" x2="285" y2="160" class="wire" marker-end="url(#d)"/>
  <line x1="459" y1="118" x2="459" y2="160" class="wire" marker-end="url(#d)"/>

  <!-- admission -->
  <path d="M230 240 L490 240 L462 272 L258 272 Z" class="ctl"/>
  <text x="288" y="260" class="lbl" fill="#9A6B12">admission select</text>
  <text x="180" y="288" class="sub">first READY entry (the FSM would not stall it), and for a demand request</text>
  <text x="180" y="300" class="sub">no older demand to the same line is queued ahead — data is exempt</text>
  <line x1="360" y1="214" x2="360" y2="238" class="wire" marker-end="url(#d)"/>
  <line x1="360" y1="272" x2="360" y2="318" class="wire" marker-end="url(#d)"/>
  <text x="366" y="314" class="wl">msg</text>

  <!-- ══════════ address decode ══════════ -->
  <g>
    <rect x="150" y="320" width="420" height="34" rx="3" class="blk"/>
    <line x1="392" y1="320" x2="392" y2="354" stroke="#5A6B75"/>
    <line x1="500" y1="320" x2="500" y2="354" stroke="#5A6B75"/>
    <text x="250" y="341" class="lbl mono">tag [63:14]</text>
    <text x="414" y="341" class="lbl mono">set [13:6]</text>
    <text x="510" y="341" class="lbl mono">off</text>
    <text x="160" y="341" class="sub">addr</text>
  </g>
  <path d="M440 354 L440 392" class="wire" marker-end="url(#d)"/>
  <text x="446" y="376" class="wl">set index</text>

  <!-- ══════════ THE ARRAY (one structure: bits and data in the same line) ══════════ -->
  <rect x="180" y="394" width="700" height="190" rx="4" class="mem"/>
  <text x="192" y="414" class="lbl">cache array — 256 sets × 2 ways, one structure</text>
  <text x="192" y="429" class="sub">a line holds its coherence bits and its data together (GenericCacheLine); there is no separate tag array</text>
  <g font-size="9.5" class="mono" fill="#5E6E76"><text x="196" y="448">way 0</text><text x="544" y="448">way 1</text></g>
  <g fill="#FFFFFF" stroke="#8FB2C9" stroke-width=".9">
    <rect x="196" y="454" width="330" height="24"/><rect x="544" y="454" width="322" height="24"/>
    <rect x="196" y="482" width="330" height="24"/><rect x="544" y="482" width="322" height="24"/>
    <rect x="196" y="510" width="330" height="24"/><rect x="544" y="510" width="322" height="24"/>
  </g>
  <g font-size="9.5" class="mono" fill="#14212A">
    <text x="204" y="470">V · state · tag · owner ║ 64 B data</text><text x="552" y="470">V · state · tag · owner ║ 64 B data</text>
    <text x="204" y="498">V · state · tag · owner ║ 64 B data</text><text x="552" y="498">V · state · tag · owner ║ 64 B data</text>
    <text x="204" y="526">⋮</text><text x="552" y="526">⋮</text>
  </g>
  <text x="192" y="552" class="sub">state is the line's MESI_LLC state; owner names the L1 that holds it</text>
  <text x="192" y="566" class="sub">a way may be reserved for one core (way_partition); LRU chooses the victim among the ways left</text>

  <!-- left access path: untimed bits read -->
  <path d="M180 470 L120 470 L120 620" class="cwire" marker-end="url(#c)"/>
  <text x="34" y="452" class="cl">bits / state read</text>
  <text x="34" y="464" class="cl">tag compare</text>
  <text x="34" y="476" class="cl">UNTIMED —</text>
  <text x="34" y="488" class="cl">claims no port</text>

  <!-- comparators on the bits path -->
  <g>
    <path d="M900 440 L952 454 L952 478 L900 492 Z" class="blk"/><text x="912" y="470" class="lbl">=</text>
    <path d="M900 500 L952 514 L952 538 L900 552 Z" class="blk"/><text x="912" y="530" class="lbl">=</text>
    <path d="M880 466 L898 466" class="wire" marker-end="url(#d)"/>
    <path d="M880 526 L898 526" class="wire" marker-end="url(#d)"/>
    <text x="884" y="460" class="wl">w0</text><text x="884" y="520" class="wl">w1</text>
    <path d="M300 354 L300 380 L960 380 L960 438" class="wire" marker-end="url(#d)"/>
    <text x="620" y="376" class="wl">tag</text>
  </g>
  <rect x="974" y="470" width="96" height="50" rx="3" class="ctl"/>
  <text x="986" y="490" class="lbl" fill="#9A6B12">hit / way</text>
  <text x="986" y="506" class="sub">select</text>
  <path d="M952 466 L972 482" class="wire" marker-end="url(#d)"/>
  <path d="M952 526 L972 508" class="wire" marker-end="url(#d)"/>
  <path d="M974 512 L940 512 L940 596 L300 596 L300 620" class="cwire" marker-end="url(#c)"/>
  <text x="560" y="592" class="cl">hit · way · line state → FSM</text>

  <!-- ══════════ the timed data port ══════════ -->
  <path d="M1090 394 L1246 394 L1222 434 L1114 434 Z" class="ctl"/>
  <text x="1108" y="412" class="lbl" fill="#9A6B12">array-port arbiter</text>
  <text x="1104" y="426" class="sub" fill="#9A6B12">RR over the four L1 slots</text>
  <g class="wl">
    <path d="M1120 366 L1132 392" class="wire" marker-end="url(#d)"/><text x="1064" y="360">demand read</text>
    <path d="M1180 366 L1176 392" class="wire" marker-end="url(#d)"/><text x="1150" y="360">evict read</text>
    <path d="M1230 366 L1216 392" class="wire" marker-end="url(#d)"/><text x="1188" y="348">fill / write-back</text>
    <text x="1210" y="360">data write</text>
  </g>
  <rect x="1090" y="450" width="156" height="42" rx="3" class="blk"/>
  <text x="1100" y="466" class="lbl">port busy timer</text>
  <text x="1100" y="481" class="sub mono">A_LLC = 10 cycles</text>
  <path d="M1168 434 L1168 448" class="cwire" marker-end="url(#c)"/>
  <text x="1090" y="512" class="sub">the arbiter is consulted only while</text>
  <text x="1090" y="524" class="sub">the port is free</text>

  <!-- bypass: MSHR/PWB-resident accesses cut in -->
  <path d="M1246 404 L1264 404" class="byp"/>
  <path d="M1258 404 L1258 540 L1000 540 L1000 470 L884 470" class="byp" marker-end="url(#d)"/>
  <text x="900" y="556" class="sub">a line held in the MSHR or the write-back buffer is read or</text>
  <text x="900" y="568" class="sub">written without waiting for the port — it is not in the array —</text>
  <text x="900" y="580" class="sub">but it still restarts the busy timer, so it cuts in ahead</text>

  <!-- data in/out of the array through the port -->
  <path d="M1088 470 L1072 470" class="wire" marker-end="url(#d)"/>
  <path d="M880 500 L700 500 L700 618 L640 618 L640 128" class="wire" marker-end="url(#d)"/>
  <text x="646" y="300" class="wl">line data → TX response</text>

  <!-- ══════════ control: FSM + sequencer ══════════ -->
  <rect x="80" y="622" width="330" height="96" rx="4" class="ctl"/>
  <text x="92" y="642" class="lbl" fill="#9A6B12">coherence FSM — Protocols_FSM/MESI_LLC.csv</text>
  <text x="92" y="659" class="sub mono">state × event → next state + actions</text>
  <text x="92" y="675" class="sub">events: GetS GetM Replacement PutM_fromOwner</text>
  <text x="92" y="687" class="sub">PutM_fromNonOwner Data_from{Lower,Upper} Own_Invalidation</text>
  <text x="92" y="705" class="sub">states: N I S EorM · NE_d NM_d IorS_a MN_d S_d I_d N_a</text>
  <path d="M410 660 L440 660 L440 470 L878 470" class="cwire" marker-end="url(#c)"/>
  <text x="446" y="640" class="cl">next state → line bits</text>

  <rect x="80" y="736" width="330" height="80" rx="4" class="ctl"/>
  <text x="92" y="756" class="lbl" fill="#9A6B12">action sequencer</text>
  <text x="92" y="772" class="sub">protocol actions: GetData · SendData · SaveData</text>
  <text x="92" y="784" class="sub">SetOwner · ClearOwner · IssueInv · WriteBack · Stall</text>
  <text x="92" y="802" class="sub">each becomes a port claim, a buffer allocation, or a message</text>
  <path d="M245 718 L245 734" class="cwire" marker-end="url(#c)"/>

  <!-- ══════════ MSHR / PWB ══════════ -->
  <rect x="440" y="736" width="330" height="80" rx="4" class="mem"/>
  <text x="452" y="756" class="lbl">MSHR — 64 entries</text>
  <text x="452" y="772" class="sub">a line being fetched lives here, not in the array,</text>
  <text x="452" y="784" class="sub">until its fill is installed</text>
  <text x="452" y="802" class="sub mono">allocate on miss · free on fill</text>

  <rect x="800" y="736" width="330" height="80" rx="4" class="mem"/>
  <text x="812" y="756" class="lbl">write-back buffer — 32 entries</text>
  <text x="812" y="772" class="sub">a dirty victim waits here for its write to memory;</text>
  <text x="812" y="784" class="sub">its way in the array is released at once</text>
  <text x="812" y="802" class="sub mono">allocate on eviction · free on write</text>

  <path d="M1022 520 L1022 700 L605 700 L605 734" class="wire" marker-end="url(#d)"/>
  <text x="660" y="696" class="wl">miss → allocate</text>
  <path d="M965 584 L965 734" class="wire" marker-end="url(#d)"/>
  <text x="970" y="700" class="wl">victim line</text>

  <!-- inclusion: IssueInv comes from the FSM, not from the write-back buffer -->
  <path d="M410 770 L424 770 L424 660 L1268 660 L1268 128" class="iwire" marker-end="url(#r)"/>
  <text x="1010" y="654" class="wl" fill="#BE3F24">IssueInv — inclusion: evicting a line</text>
  <text x="1010" y="642" class="wl" fill="#BE3F24">an L1 holds invalidates its copy first</text>

  <!-- ══════════ bus[1] + memory ══════════ -->
  <rect x="34" y="860" width="1212" height="62" rx="4" class="io"/>
  <text x="46" y="876" class="lbl mono" fill="#4B32A8">bus[1] — point-to-point memory bus (full duplex)</text>
  <rect x="440" y="882" width="160" height="30" rx="3" class="blk"/><text x="452" y="895" class="lbl">TX read / write</text><text x="452" y="907" class="sub mono">miss · dirty evict</text>
  <rect x="624" y="882" width="150" height="30" rx="3" class="blk"/><text x="636" y="895" class="lbl">RX fill</text><text x="636" y="907" class="sub mono">data from DRAM</text>
  <rect x="800" y="882" width="420" height="30" rx="3" class="blk"/><text x="812" y="902" class="lbl mono">MCsim DDR4-2400 · FR-FCFS scheduler</text>
  <line x1="605" y1="816" x2="605" y2="880" class="wire" marker-end="url(#d)"/>
  <line x1="965" y1="816" x2="965" y2="880" class="wire" marker-end="url(#d)"/>
  <line x1="774" y1="897" x2="798" y2="897" class="wire" marker-end="url(#d)"/>
  <path d="M699 882 L699 840 L1206 840 L1206 394" class="wire" marker-end="url(#d)"/>
  <text x="820" y="836" class="wl">fill → array write, MSHR freed</text>

  <!-- ══════════ legend ══════════ -->
  <g>
    <line x1="34" y1="952" x2="70" y2="952" class="wire"/><text x="78" y="956" class="sub">data path (timed)</text>
    <line x1="196" y1="952" x2="232" y2="952" class="byp"/><text x="240" y="956" class="sub">register-resident access (bypasses the port)</text>
    <line x1="500" y1="952" x2="536" y2="952" class="cwire"/><text x="544" y="956" class="sub">control (untimed in the model)</text>
    <line x1="744" y1="952" x2="780" y2="952" class="iwire"/><text x="788" y="956" class="sub">back-invalidation (inclusion)</text>
    <rect x="34" y="972" width="14" height="12" class="mem"/><text x="56" y="983" class="sub">storage</text>
    <rect x="130" y="972" width="14" height="12" class="ctl"/><text x="152" y="983" class="sub">control logic</text>
    <rect x="248" y="972" width="14" height="12" class="io"/><text x="270" y="983" class="sub">interconnect interface</text>
    <text x="420" y="983" class="sub">observed by the Logger and the raw trace: queue arrival · admission · port claim · data emitted</text>
  </g>
</svg>
